<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 360° Liquid Glass Specular & Depth Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242E3B"/>
      <stop offset="100%" stop-color="#141A22"/>
    </linearGradient>
    
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E05436"/>
      <stop offset="100%" stop-color="#B33920"/>
    </linearGradient>
    
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4A3F35" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Strict 2px-style rounded squircle base (scaled to 512) -->
  <rect x="24" y="24" width="464" height="464" rx="54" fill="url(#bgGrad)" filter="url(#subtleGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="54" fill="none" stroke="url(#specularBorder)" stroke-width="8"/>

  <!-- Perfectly Centered (X=256, Y=256) Big Bold 'OUTFIT' Text Only -->
  <text x="256" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Outfit', 'Helvetica Neue', sans-serif" font-size="108" font-weight="900" letter-spacing="2" text-anchor="middle" dominant-baseline="central" fill="#F8F7F4">
    OUT<tspan fill="url(#terracottaGrad)">FIT</tspan>
  </text>
</svg>
